spring:
  datasource:
    url: jdbc:h2:mem:fintrack_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-secret-key-that-is-at-least-32-characters-long
    expiration-minutes: 60
  cors:
    allowed-origin: http://localhost:5173
