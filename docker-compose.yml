services:
  mysql:
    image: mysql:8.0
    container_name: fintrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: fintrack
      MYSQL_USER: ${DB_USERNAME:-fintrack_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
    ports:
      - "3306:3306"
    volumes:
      - fintrack-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  fintrack-mysql-data:
